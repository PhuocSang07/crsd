[project]
name = "crsd"
version = "0.1.0"
description = "Causal Step-Routing Distillation (CSRD) for long-CoT students (Qwen3-8B -> Qwen3-1.7B/4B-Base)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Same pinned stack as SpectralGuidedLearning/ so one venv can serve both projects:
    # torch/vllm/transformers are validated together.
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torchaudio==2.11.0",
    "vllm==0.27.1",
    "transformers==5.5.3",
    # pins = crsd.txt (repo root) = spectral_guided_learning.txt, the stack already run on B200
    "peft==0.20.0",
    "deepspeed==0.19.6",
    "datasets==5.0.1",
    "accelerate==1.14.0",
    "numpy==2.3.5",
    "scipy>=1.13",
    "scikit-learn>=1.5",   # D3 logistic regression / AUC
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "matplotlib",
    "pyyaml==6.0.3",
    "tqdm==4.70.0",
    "safetensors",
    "huggingface_hub",     # scripts/data/download_*.sh (online setup only)
    "math-verify==0.8.0",
    "pylatexenc",          # oat_math_grader's latex->text branch (else palign_grader silently runs math_verify only)
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
